# Gitleaks configuration for CloudZombie.
#
# The default Gitleaks rule set stays fully enabled. The only addition is a
# narrowly scoped allowlist for AWS resource identifiers (volume, snapshot,
# instance, allocation, image, and network IDs). Demo fixtures, tests, and
# documentation reference identifiers such as vol-0a1b2c3d4e5f60001, and the
# generic-api-key rule can classify them as secrets when they appear next to
# words like "api". These identifiers are public resource names, never
# credentials. No path, commit, or credential-shaped value is allowlisted.

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "AWS resource identifiers in fixtures, tests, and docs are not secrets"
regexTarget = "match"
regexes = [
  '''\b(?:vol|snap|i|eipalloc|eipassoc|ami|eni|sg|subnet|vpc)-[0-9a-f]{8}(?:[0-9a-f]{9})?\b''',
]
