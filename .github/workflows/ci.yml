name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloudzombie_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloudzombie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cloudzombie_test
      - run: pytest --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s bash -S style backend/tests/golden/*.sh backend/entrypoint.sh scripts/*.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            echo "Waiting for services ($attempt/60)..."
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1
      - name: Containers run as non-root
        run: |
          docker compose exec -T backend id
          docker compose exec -T frontend id
          test "$(docker compose exec -T backend id -u | tr -d '\r')" != 0
          test "$(docker compose exec -T frontend id -u | tr -d '\r')" != 0
      - name: Host ports bind to loopback only
        run: |
          test "$(docker compose port frontend 3000)" = "127.0.0.1:3000"
          test "$(docker compose port backend 8000)" = "127.0.0.1:8000"
      - name: API smoke flow through the frontend proxy
        run: |
          base=http://127.0.0.1:3000
          hero=vol-0a1b2c3d4e5f60001
          curl -fsS "$base/api/overview" | jq .

          curl -fsS -X POST "$base/api/scans" \
            -H 'Content-Type: application/json' -d '{"wait": true}' > scan1.json
          hero_id=$(curl -fsS --get "$base/api/findings" \
            --data-urlencode "q=$hero" --data-urlencode 'page_size=200' \
            | jq -er --arg hero "$hero" '.items[] | select(.resource_id == $hero) | .id')
          curl -fsS "$base/api/findings/$hero_id" > hero1.json
          total1=$(curl -fsS "$base/api/findings?page_size=200" | jq -er '.total')

          curl -fsS -X POST "$base/api/scans" \
            -H 'Content-Type: application/json' -d '{"wait": true}' > scan2.json
          curl -fsS "$base/api/findings/$hero_id" > hero2.json
          total2=$(curl -fsS "$base/api/findings?page_size=200" | jq -er '.total')

          first1=$(jq -er '.first_observed_at' hero1.json)
          first2=$(jq -er '.first_observed_at' hero2.json)
          observations1=$(jq -er '.observation_count' hero1.json)
          observations2=$(jq -er '.observation_count' hero2.json)
          consecutive1=$(jq -er '.consecutive_observations' hero1.json)
          consecutive2=$(jq -er '.consecutive_observations' hero2.json)

          test "$first1" = "$first2"
          test "$observations2" -eq $((observations1 + 1))
          test "$consecutive2" -eq $((consecutive1 + 1))
          test "$total1" -eq "$total2"
          printf 'first_observed_at=%s\n' "$first1"
          printf 'observation_count=%s -> %s\n' "$observations1" "$observations2"
          printf 'consecutive_observations=%s -> %s\n' "$consecutive1" "$consecutive2"
          printf 'total_findings=%s -> %s\n' "$total1" "$total2"
      - name: Local read latency (20 requests per endpoint)
        run: |
          measure() {
            endpoint=$1
            label=$2
            output="latency-${label}.txt"
            curl -fsS -o /dev/null "http://127.0.0.1:3000${endpoint}"
            for _ in $(seq 1 20); do
              curl -sS -o /dev/null -w '%{http_code} %{time_total}\n' \
                "http://127.0.0.1:3000${endpoint}"
            done > "$output"
            if ! awk '$1 == "000" || $1 + 0 >= 500 { bad=1 } END { exit bad }' "$output"; then
              cat "$output"
              return 1
            fi
            sort -k2,2n "$output" | awk -v label="$label" '
              { values[NR]=$2 }
              END {
                median=values[int((NR+1)/2)]
                printf "%s min=%s median=%s max=%s\n", label, values[1], median, values[NR]
              }'
          }
          measure / root
          measure /api/health health
          measure /api/overview overview
          measure /api/findings findings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - name: Persistence survives restart
        run: |
          wait_services() {
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
                && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                return 0
              fi
              echo "Waiting for services after restart ($attempt/60)..."
              sleep 2
            done
            docker compose ps
            docker compose logs --no-color --tail=200
            return 1
          }

          base=http://127.0.0.1:3000
          hero=vol-0a1b2c3d4e5f60001
          scans_before=$(curl -fsS "$base/api/scans" | jq -er '.total')
          hero_id=$(curl -fsS --get "$base/api/findings" \
            --data-urlencode "q=$hero" --data-urlencode 'page_size=200' \
            | jq -er --arg hero "$hero" '.items[] | select(.resource_id == $hero) | .id')
          observations_before=$(curl -fsS "$base/api/findings/$hero_id" | jq -er '.observation_count')

          docker compose restart
          wait_services
          test "$(curl -fsS "$base/api/scans" | jq -er '.total')" -eq "$scans_before"
          test "$(curl -fsS "$base/api/findings/$hero_id" | jq -er '.observation_count')" \
            -eq "$observations_before"

          docker compose down
          docker compose up -d
          wait_services
          test "$(curl -fsS "$base/api/scans" | jq -er '.total')" -eq "$scans_before"
          test "$(curl -fsS "$base/api/findings/$hero_id" | jq -er '.observation_count')" \
            -eq "$observations_before"
          printf 'persistence scans=%s hero_observations=%s\n' \
            "$scans_before" "$observations_before"
      - name: Collect compose logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Stop services
        if: always()
        run: docker compose down -v
